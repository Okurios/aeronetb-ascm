<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroNetB ASCM — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon">✈</span>
      <h1>AeroNetB ASCM</h1>
      <p>Aerospace Supply Chain Management</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@aeronetb.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div id="loginError" class="alert alert-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
    </form>
    <div class="login-hint">
      <small>Demo accounts (password: <strong>Password1!</strong>):<br>
        alice@aeronetb.com · bob@aeronetb.com · carol@aeronetb.com<br>
        dave@aeronetb.com · eve@aeronetb.com
      </small>
    </div>
  </div>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('ascm_token')) window.location.href = 'dashboard.html';

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.style.display = 'none';
      btn.textContent = 'Signing in…'; btn.disabled = true;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('ascm_token', data.token);
        localStorage.setItem('ascm_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch(ex) {
        err.textContent = ex.message; err.style.display = 'block';
        btn.textContent = 'Sign In'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
